<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lebanese Online Academy | إعلان الأكاديمية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* حاوية الفيديو للتوسيط التام */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    #bgVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* طبقة تغميق خفيفة جداً لتحسين وضوح الفيديو والخلفية */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      z-index: 2;
      pointer-events: none;
    }

    /* المحتوى فوق الفيديو */
    .content {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      pointer-events: none;
    }

    .content > * {
      pointer-events: auto;
    }

    h2 {
      margin-bottom: 15px;
      color: #d4af37;
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-style: italic;
      font-weight: 700;
      text-shadow: 0 3px 15px rgba(0,0,0,0.9);
    }

    .skip-btn {
      display: inline-block;
      background: #d4af37;
      color: #000;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }

    .skip-btn:hover {
      background: #e6c555;
      transform: translateY(-2px);
    }

    /* زر الصوت الاختياري في حال رغب الزائر بسماع الصوت */
    .sound-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(212, 175, 55, 0.9);
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: 0.3s;
    }
    .sound-btn:hover {
      background: #d4af37;
    }
  </style>
</head>
<body>

  <!-- زر تفعيل الصوت (يسمح للزائر بفك الكتم بكليك واحدة متى أرد) -->
  <button class="sound-btn" id="soundToggle">
    <i class="fas fa-volume-mute" id="soundIcon"></i> <span id="soundText">تفعيل الصوت</span>
  </button>

  <!-- حاوية الفيديو (مكتوم لضمان عمله فوراً بدون توقف وبدون Lag) -->
  <div class="video-container">
    <video autoplay muted playsinline preload="auto" id="bgVideo">
      <source src="./add-video.mp4" type="video/mp4">
      متصفحك لا يدعم عرض الفيديو.
    </video>
  </div>

  <div class="overlay"></div>

  <div class="content">
    <h2>Lebanese Online Academy</h2>
    <div>
      <a href="index.html" class="skip-btn">
        Go To My Website <i class="fas fa-arrow-left"></i>
      </a>
    </div>
  </div>

  <script>
    const video = document.getElementById('bgVideo');
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    // تفعيل تفاعل زر الصوت للزائر
    soundToggle.addEventListener('click', function() {
      if (video.muted) {
        video.muted = false;
        video.play();
        soundIcon.className = "fas fa-volume-up";
        soundText.innerText = "الصوت مَفعل";
      } else {
        video.muted = true;
        soundIcon.className = "fas fa-volume-mute";
        soundText.innerText = "تفعيل الصوت";
      }
    });

    // الانتقال تلقائياً للصفحة الرئيسية عند نهاية الفيديو الفعلي
    video.addEventListener('ended', function() {
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
